name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['render/**', '.github/workflows/render-otm.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # the project has no gradlew script, so install the Gradle version from gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: gradle --no-daemon assembleDebug

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/osmv-offline-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: osmv-offline-apk
          path: out/*.apk

      # direct download link for the phone: Releases page of the repository
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OSM Viewer offline – Build ${{ github.run_number }}
          body: Debug build of Simple OSM Viewer with offline maps. Install the APK attached below.
          files: out/*.apk
