name: Build APK

on:
  push:
    branches: [main]
    paths-ignore: ['render/**', '.github/workflows/render-otm.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # the project has no gradlew script, so install the Gradle version from gradle-wrapper.properties
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Build debug APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleDebug 2>&1 | tee build.log

      # on failure the build log goes to the branch "build-logs" (readable without logging in)
      - name: Publish build log
        if: failure()
        run: |
          mkdir -p /tmp/bl && cp build.log /tmp/bl/ && cd /tmp/bl
          git init -q -b build-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "build log of run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" build-logs

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/*.apk out/osmv-offline-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: osmv-offline-apk
          path: out/*.apk

      # direct download link for the phone: Releases page of the repository
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: OSM Viewer offline – Build ${{ github.run_number }}
          body: Debug build of Simple OSM Viewer with offline maps. Install the APK attached below.
          files: out/*.apk
