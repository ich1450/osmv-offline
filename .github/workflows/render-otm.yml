name: Render OpenTopoMap MBTiles

# Renders the region configured in render/region.env.
# Starts on every push that changes render/ (or manually via "Run workflow").
on:
  push:
    branches: [main]
    paths: ['render/**', '.github/workflows/render-otm.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Render
        run: |
          mkdir -p logs
          set -o pipefail
          source render/region.env
          for r in $REGIONS; do
            echo "########## region $r"
            REGION=$r OUT=$GITHUB_WORKSPACE/out bash render/render.sh 2>&1 | tee -a logs/render.log
          done

      - name: Sample tiles for checking
        if: always()
        run: |
          cp out/preview/*.jpg logs/ 2>/dev/null || true
          for f in out/*.mbtiles; do
            [ -f "$f" ] || continue
            n=$(basename "$f" .mbtiles)
            sqlite3 "$f" "SELECT zoom_level, count(*), sum(length(tile_data))/1024/1024 || ' MB' FROM tiles GROUP BY zoom_level;" > "logs/tile-stats-$n.txt"
            ls -la "$f" >> "logs/tile-stats-$n.txt"
            python3 - "$f" "$n" <<'EOF'
          import math, sqlite3, sys
          f, n = sys.argv[1], sys.argv[2]
          db = sqlite3.connect(f)
          w, s, e, nn = map(float, db.execute("SELECT value FROM metadata WHERE name='bounds'").fetchone()[0].split(","))
          lon, lat = (w + e) / 2, (s + nn) / 2
          for z in (12, 14, 16):
              t = 2 ** z
              x = int((lon + 180) / 360 * t)
              y = int((1 - math.log(math.tan(math.radians(lat)) + 1 / math.cos(math.radians(lat))) / math.pi) / 2 * t)
              row = db.execute("SELECT tile_data FROM tiles WHERE zoom_level=? AND tile_column=? AND tile_row=?", (z, x, t - 1 - y)).fetchone()
              if row:
                  open(f"logs/sample-{n}-z{z}.png", "wb").write(row[0])
          EOF
          done

      # logs and sample tiles go to the branch "render-logs" so they can be read without logging in
      - name: Publish logs
        if: always()
        run: |
          cd logs
          git init -q -b render-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "run ${{ github.run_id }} ${{ job.status }}" > STATUS
          git add -A && git commit -qm "logs of run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" render-logs

      - name: Publish map
        if: success() && hashFiles('out/*.mbtiles') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: map-${{ github.run_number }}
          name: Offline map – ${{ github.run_number }}
          body: OpenTopoMap-style offline map (MBTiles, 512 px tiles). Import it in OSM Viewer via "Offline maps…" → "Import map file".
          files: out/*.mbtiles
