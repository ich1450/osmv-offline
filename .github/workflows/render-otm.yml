name: Render OpenTopoMap MBTiles

# Renders the region configured in render/region.env.
# Starts on every push that changes render/ (or manually via "Run workflow").
on:
  push:
    branches: [main]
    paths: ['render/**', '.github/workflows/render-otm.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: render
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Render
        run: |
          mkdir -p logs
          set -o pipefail
          OUT=$GITHUB_WORKSPACE/out bash render/render.sh 2>&1 | tee logs/render.log

      - name: Sample tiles for checking
        if: always()
        run: |
          source render/region.env
          f=out/$NAME-otm.mbtiles
          [ -f "$f" ] || exit 0
          sqlite3 "$f" "SELECT zoom_level, count(*), sum(length(tile_data))/1024/1024 || ' MB' FROM tiles GROUP BY zoom_level;" > logs/tile-stats.txt
          IFS=, read -r W S E N <<< "$BBOX"
          python3 - "$f" "$W" "$S" "$E" "$N" <<'EOF'
          import math, sqlite3, sys
          f, w, s, e, n = sys.argv[1], *map(float, sys.argv[2:])
          lon, lat = (w + e) / 2, (s + n) / 2
          db = sqlite3.connect(f)
          for z in (10, 12, 14, 15, 16):
              t = 2 ** z
              x = int((lon + 180) / 360 * t)
              y = int((1 - math.log(math.tan(math.radians(lat)) + 1 / math.cos(math.radians(lat))) / math.pi) / 2 * t)
              row = db.execute("SELECT tile_data FROM tiles WHERE zoom_level=? AND tile_column=? AND tile_row=?", (z, x, t - 1 - y)).fetchone()
              if row:
                  open(f"logs/sample-z{z}.png", "wb").write(row[0])
          EOF

      # logs and sample tiles go to the branch "render-logs" so they can be read without logging in
      - name: Publish logs
        if: always()
        run: |
          cd logs
          git init -q -b render-logs
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          echo "run ${{ github.run_id }} ${{ job.status }}" > STATUS
          git add -A && git commit -qm "logs of run ${{ github.run_id }}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" render-logs

      - name: Publish map
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: map-${{ github.run_number }}
          name: Offline map – ${{ github.run_number }}
          body: OpenTopoMap-style offline map (MBTiles, 512 px tiles). Import it in OSM Viewer via "Offline maps…" → "Import map file".
          files: out/*.mbtiles
